name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache on release branches: their tarball is what npm gets.
          cache: ${{ !startsWith(github.ref, 'refs/heads/release/') && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Check the web embed README release lines
        run: node .github/scripts/web-embed-release.mjs check-template
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify web embed release README integrity
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/web-embed/')
        run: node .github/scripts/web-embed-release.mjs check
      - run: pnpm --filter @rooks-ai/web-embed exec playwright install --with-deps --only-shell chromium
      - run: pnpm test
      - run: pnpm check:package
      - run: pnpm pack:packages
      # craft publishes this artifact; pull request runs (forks too) never upload it.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: packs/*.tgz
          if-no-files-found: error
          overwrite: true
