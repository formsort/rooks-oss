<!doctype html>
<script type="module">
  const hostOrigin = new URL(document.referrer).origin;
  const query = new URLSearchParams(location.search);

  window.addEventListener('message', ({ source, origin, data, ports }) => {
    if (source !== parent || origin !== hostOrigin || data.type !== 'init') {
      return;
    }

    const answers = data.payload?.answers;
    const hasAnswers = query.get('embed') === 'answers';
    if (
      hasAnswers
        ? answers?.count !== 3 || answers?.enabled !== true || answers?.choices?.[0] !== 'test'
        : query.get('embed') !== '1' || 'payload' in data
    ) {
      return;
    }

    const [port] = ports;
    port.postMessage({ type: 'height', payload: { height: Number(query.get('height')) } });
    if (query.has('events')) {
      const payload = { responseId: 'response-1', answers: { first_name: 'Ada' } };
      const page = { id: 'page-1', index: 0 };
      port.postMessage({ type: 'loaded', payload: null });
      port.postMessage({ type: 'pageLoaded', payload });
      port.postMessage({ type: 'loaded', payload });
      port.postMessage({ type: 'pageLoaded', payload: { ...payload, page } });
      port.postMessage({ type: 'pageCompleted', payload: { ...payload, page } });
      port.postMessage({ type: 'responsesSaved', payload });
      port.postMessage({ type: 'completed', payload });
    }
    if (hasAnswers) {
      port.postMessage({ type: 'redirect', payload: { url: 'javascript:void(0)' } });
      port.postMessage({ type: 'redirect', payload: { url: '/test/form.html#complete' } });
    }
  });

  if (!query.has('silent')) {
    parent.postMessage({ type: 'ready' }, '*');
  }
  parent.postMessage({ type: 'fixture-loaded' }, hostOrigin);
</script>
